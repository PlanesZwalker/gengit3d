<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenGit3D — 3D Git Commit Graph</title>
  <!-- inline favicon: avoids the default /favicon.ico 404 request -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%234f9dff'/%3E%3Ccircle cx='16' cy='7' r='4' fill='%2357c785'/%3E%3Ccircle cx='16' cy='25' r='4' fill='%23ff8c42'/%3E%3Cline x1='16' y1='11' x2='16' y2='21' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    /* All chrome colours come from CSS variables, set per theme by applyTheme().
       Defaults below = midnight; the light themes override them at runtime. */
    :root {
      --bg: #0b0b10; --panel: #16171c; --border: #2a2c36; --text: #e0e0e0;
      --muted: #8b93a7; --accent: #4f9dff; --input: #0d0e12;
      --btn: #2a3550; --btn-border: #3a4a70; --btn-text: #dbe6ff;
      --overlay: #000000aa; --err: #e05c75; --busy: #f2c14e;
      --diff-add: #7ee787; --diff-del: #ff7b72; --diff-hunk: #79c0ff;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; transition: background .15s, color .15s; }
    #app { position: fixed; inset: 0; }
    #gengit3d-stats { position: fixed; top: 10px; left: 10px; font: 12px monospace; background: var(--overlay); color: var(--text); padding: 6px 10px; border-radius: 6px; z-index: 5; border: 1px solid var(--border); }
    #gengit3d-help { position: fixed; bottom: 10px; left: 10px; font: 11px monospace; color: var(--muted); z-index: 5; }
    #gengit3d-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 16px monospace; color: var(--muted); z-index: 4; text-align: center; padding: 0 20px; }
    .err { color: var(--err); }
    #gengit3d-bar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px; box-shadow: 0 4px 18px #0004; }
    #gengit3d-bar input, #gengit3d-bar select { background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 6px 9px; font: 12px monospace; outline: none; }
    #gengit3d-bar input#gengit3d-repo { width: 300px; }
    #gengit3d-bar input#gengit3d-depth { width: 56px; }
    #gengit3d-bar input:focus, #gengit3d-bar select:focus { border-color: var(--accent); }
    #gengit3d-bar button { background: var(--btn); color: var(--btn-text); border: 1px solid var(--btn-border); border-radius: 5px; padding: 6px 12px; font: 12px monospace; cursor: pointer; }
    #gengit3d-bar button:hover { filter: brightness(1.12); }
    #gengit3d-bar button:disabled { opacity: .5; cursor: default; }
    #gengit3d-bar label { font: 11px monospace; color: var(--muted); }
    #gengit3d-status { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); z-index: 6; font: 11px monospace; color: var(--muted); background: var(--overlay); padding: 4px 10px; border-radius: 5px; max-width: 90vw; }
    #gengit3d-status.busy { color: var(--busy); }
    #gengit3d-status.err { color: var(--err); }

    /* CSS2D timeline tick labels */
    .gengit3d-tick { font: 11px monospace; color: var(--muted); background: var(--overlay); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); white-space: nowrap; }

    /* branch legend panel */
    #gengit3d-legend { position: fixed; top: 0; left: 0; height: 100%; width: 280px; max-width: 80vw; background: var(--panel); border-right: 1px solid var(--border); z-index: 7; display: flex; flex-direction: column; transform: translateX(-100%); transition: transform .18s ease; box-shadow: 6px 0 24px #0004; }
    #gengit3d-legend.open { transform: translateX(0); }
    #gengit3d-legend header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    #gengit3d-legend header .h { font: 12px monospace; color: var(--muted); }
    #gengit3d-legend header button { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 3px 9px; font: 12px monospace; cursor: pointer; }
    #gengit3d-legend .search { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    #gengit3d-legend .search input { width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px; font: 11px monospace; outline: none; box-sizing: border-box; }
    #gengit3d-legend .search input:focus { border-color: var(--accent); }
    #gengit3d-legend .bulk { display: flex; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--border); }
    #gengit3d-legend .bulk button { flex: 1; background: var(--btn); color: var(--btn-text); border: 1px solid var(--btn-border); border-radius: 4px; padding: 4px 6px; font: 10px monospace; cursor: pointer; }
    #gengit3d-legend .bulk button:hover { filter: brightness(1.12); }
    #gengit3d-legend .date-filter { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    #gengit3d-legend .date-filter label { display: block; font: 10px monospace; color: var(--muted); margin-bottom: 4px; }
    #gengit3d-legend .date-filter .row { display: flex; gap: 6px; align-items: center; }
    #gengit3d-legend .date-filter input[type="date"] { flex: 1; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; font: 11px monospace; outline: none; color-scheme: dark; }
    #gengit3d-legend .date-filter input[type="date"]:focus { border-color: var(--accent); }
    #gengit3d-legend .date-filter button { background: var(--btn); color: var(--btn-text); border: 1px solid var(--btn-border); border-radius: 4px; padding: 4px 8px; font: 10px monospace; cursor: pointer; white-space: nowrap; }
    #gengit3d-legend .date-filter button:hover { filter: brightness(1.12); }
    #gengit3d-legend .list { overflow-y: auto; flex: 1; padding: 4px 0; }
    #gengit3d-legend .list .item { display: flex; align-items: center; gap: 6px; padding: 3px 12px; font: 11px monospace; cursor: pointer; }
    #gengit3d-legend .list .item:hover { background: var(--input); }
    #gengit3d-legend .list .item input[type="checkbox"] { margin: 0; accent-color: var(--accent); }
    #gengit3d-legend .list .item .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    #gengit3d-legend .list .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    #gengit3d-legend .list .item .count { color: var(--muted); font-size: 10px; }
    #gengit3d-legend .list .item.hidden-branch .name { text-decoration: line-through; opacity: 0.5; }
    #gengit3d-legend .list .item.hidden-branch .swatch { opacity: 0.3; }
    #gengit3d-legend .empty { color: var(--muted); font: 11px monospace; padding: 12px; }

    /* commit details panel */
    #gengit3d-detail { position: fixed; top: 0; right: 0; height: 100%; width: 420px; max-width: 92vw; background: var(--panel); border-left: 1px solid var(--border); z-index: 7; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .18s ease; box-shadow: -6px 0 24px #0004; }
    #gengit3d-detail.open { transform: translateX(0); }
    #gengit3d-detail header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    #gengit3d-detail header .h { font: 12px monospace; color: var(--muted); }
    #gengit3d-detail header button { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 3px 9px; font: 12px monospace; cursor: pointer; }
    #gengit3d-detail .body { overflow: auto; padding: 12px; flex: 1; }
    #gengit3d-detail h2 { font: 14px/1.4 monospace; margin: 0 0 8px; color: var(--text); }
    #gengit3d-detail .meta { font: 11px/1.7 monospace; color: var(--muted); margin-bottom: 10px; }
    #gengit3d-detail .meta b { color: var(--text); font-weight: 600; }
    #gengit3d-detail .stat { font: 11px monospace; margin: 8px 0; color: var(--text); }
    #gengit3d-detail .files { list-style: none; padding: 0; margin: 6px 0 12px; }
    #gengit3d-detail .files li { font: 11px monospace; display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px dashed var(--border); }
    #gengit3d-detail .files .p { flex: 1; word-break: break-all; color: var(--text); }
    #gengit3d-detail .files .a { color: var(--diff-add); }
    #gengit3d-detail .files .d { color: var(--diff-del); }
    #gengit3d-detail pre.diff { font: 11px/1.45 monospace; white-space: pre-wrap; word-break: break-word; margin: 0; padding: 8px; background: var(--input); border: 1px solid var(--border); border-radius: 6px; max-height: 46vh; overflow: auto; }
    #gengit3d-detail pre.diff .add { color: var(--diff-add); }
    #gengit3d-detail pre.diff .del { color: var(--diff-del); }
    #gengit3d-detail pre.diff .hunk { color: var(--diff-hunk); }
    #gengit3d-detail .msg { font: 11px/1.6 monospace; white-space: pre-wrap; color: var(--text); background: var(--input); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 10px; }
    #gengit3d-detail .empty { color: var(--muted); font: 12px monospace; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="gengit3d-bar">
    <input id="gengit3d-repo" type="text" spellcheck="false" list="gengit3d-repos"
           placeholder="repo path (/repos/x, C:\path) or git URL (https://…)" />
    <datalist id="gengit3d-repos"></datalist>
    <label for="gengit3d-depth">depth</label>
    <input id="gengit3d-depth" type="number" min="0" value="500" title="shallow clone depth (URL only, 0 = full)" />
    <button id="gengit3d-render">Render</button>
    <label for="gengit3d-theme">theme</label>
    <select id="gengit3d-theme" title="colour theme (light + dark)"></select>
    <label title="rotate the view automatically"><input id="gengit3d-rotate" type="checkbox" /> rotate</label>
    <button id="gengit3d-legend-toggle" title="show/hide branch legend">Branches</button>
  </div>

  <div id="gengit3d-stats">loading…</div>
  <div id="gengit3d-status"></div>
  <div id="gengit3d-help">drag: rotate · scroll: zoom · right-drag: pan · click a commit: details · hover: info</div>
  <div id="gengit3d-loading">loading gengit3d.graph.json …</div>

  <aside id="gengit3d-legend">
    <header>
      <span class="h">branches</span>
      <button id="gengit3d-legend-close" title="close">✕</button>
    </header>
    <div class="search">
      <input id="gengit3d-legend-search" type="text" placeholder="filter branches…" spellcheck="false" />
    </div>
    <div class="bulk">
      <button id="gengit3d-legend-all">All</button>
      <button id="gengit3d-legend-none">None</button>
      <button id="gengit3d-legend-top">Top 10</button>
    </div>
    <div class="date-filter">
      <label>Filter by date</label>
      <div class="row">
        <input id="gengit3d-date-from" type="date" title="from date" />
        <input id="gengit3d-date-to" type="date" title="to date" />
        <button id="gengit3d-date-apply" title="apply date filter">Apply</button>
        <button id="gengit3d-date-clear" title="clear date filter">Clear</button>
      </div>
    </div>
    <div class="list" id="gengit3d-legend-list"><div class="empty">No graph loaded.</div></div>
  </aside>

  <aside id="gengit3d-detail">
    <header>
      <span class="h">commit details</span>
      <button id="gengit3d-detail-close" title="close">✕</button>
    </header>
    <div class="body" id="gengit3d-detail-body"><div class="empty">Click a commit sphere to see its details.</div></div>
  </aside>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import { renderGraph } from './src/scene.js';
    import { THEMES, DEFAULT_THEME, getTheme } from './src/themes.js';

    const app = document.getElementById('app');
    const loading = document.getElementById('gengit3d-loading');
    const stats = document.getElementById('gengit3d-stats');
    const statusEl = document.getElementById('gengit3d-status');
    const input = document.getElementById('gengit3d-repo');
    const depthEl = document.getElementById('gengit3d-depth');
    const renderBtn = document.getElementById('gengit3d-render');
    const themeSel = document.getElementById('gengit3d-theme');
    const rotateEl = document.getElementById('gengit3d-rotate');
    const detail = document.getElementById('gengit3d-detail');
    const detailBody = document.getElementById('gengit3d-detail-body');

    let current = null;       // active scene handle
    let currentGraph = null;  // last rendered graph (for instant theme switching)
    let currentSource = null; // { repo } — where to fetch commit details
    let theme = localStorage.getItem('gengit3d.theme') || DEFAULT_THEME;
    if (!THEMES[theme]) theme = DEFAULT_THEME;

    const isUrl = (s) => /^(https?:\/\/|git:\/\/|ssh:\/\/|git@[\w.-]+:|file:\/\/)/i.test(s.trim());
    const setStatus = (msg, kind = '') => { statusEl.textContent = msg; statusEl.className = kind; };
    const esc = (s) => String(s).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

    // ── themes ──────────────────────────────────────────────────────────────
    function applyChrome(name) {
      const ui = getTheme(name).ui;
      const r = document.documentElement.style;
      r.setProperty('--bg', ui.bg); r.setProperty('--panel', ui.panel);
      r.setProperty('--border', ui.border); r.setProperty('--text', ui.text);
      r.setProperty('--muted', ui.muted); r.setProperty('--accent', ui.accent);
      r.setProperty('--input', ui.input); r.setProperty('--btn', ui.btn);
      r.setProperty('--btn-border', ui.btnBorder); r.setProperty('--btn-text', ui.btnText);
      r.setProperty('--overlay', ui.overlay); r.setProperty('--err', ui.err);
      r.setProperty('--busy', ui.busy);
      if (ui.diffAdd) r.setProperty('--diff-add', ui.diffAdd);
      if (ui.diffDel) r.setProperty('--diff-del', ui.diffDel);
      if (ui.diffHunk) r.setProperty('--diff-hunk', ui.diffHunk);
      document.documentElement.setAttribute('data-theme', name);
    }

    function draw(graph, label, source) {
      currentGraph = graph;
      currentSource = source || graph.source || (graph.repoDir ? { repo: graph.repoDir } : null);
      if (current && current.dispose) current.dispose();
      app.innerHTML = '';
      loading.style.display = 'none';
      current = renderGraph(app, graph, {
        themeName: theme,
        autoRotate: rotateEl.checked,
        onSelect: showCommitDetails,
      });
      buildLegend(graph);
      if (label) setStatus(label);
    }

    function setTheme(name, { rerender = true } = {}) {
      if (!THEMES[name]) name = DEFAULT_THEME;
      theme = name;
      localStorage.setItem('gengit3d.theme', name);
      applyChrome(name);
      if (rerender && currentGraph) {
        const keep = statusEl.textContent;
        draw(currentGraph, null, currentSource);   // scene colours live in the WebGL context -> rebuild
        setStatus(keep);
      }
    }

    // ── branch legend ────────────────────────────────────────────────────────
    const legend = document.getElementById('gengit3d-legend');
    const legendList = document.getElementById('gengit3d-legend-list');
    const legendSearch = document.getElementById('gengit3d-legend-search');
    let branchVisibility = new Map(); // branchId -> bool
    let legendPage = 0;
    let searchDebounce = null;

    function openLegend() { legend.classList.add('open'); }
    function closeLegend() { legend.classList.remove('open'); }
    document.getElementById('gengit3d-legend-toggle').addEventListener('click', () => {
        legend.classList.contains('open') ? closeLegend() : openLegend();
    });
    document.getElementById('gengit3d-legend-close').addEventListener('click', closeLegend);

    function buildLegend(graph) {
        branchVisibility = new Map();
        const branches = [...graph.branches].sort((a, b) => b.commits - a.commits);
        branches.forEach((b) => branchVisibility.set(b.id, true));
        legendPage = 0;
        renderLegendList(graph, '');
        updateBranchFilter();
    }

    function renderLegendList(graph, filter) {
        const branches = [...graph.branches].sort((a, b) => b.commits - a.commits);
        const q = filter.toLowerCase();
        const filtered = q ? branches.filter((b) => b.name.toLowerCase().includes(q)) : branches;
        if (!filtered.length) {
            legendList.innerHTML = '<div class="empty">No branches match.</div>';
            return;
        }
        // pagination: show first 50, with "show more" button
        const PAGE_SIZE = 50;
        const page = legendPage;
        const slice = filtered.slice(0, (page + 1) * PAGE_SIZE);
        const hasMore = filtered.length > (page + 1) * PAGE_SIZE;
        legendList.innerHTML = slice.map((b) => {
            const visible = branchVisibility.get(b.id) !== false;
            const colorHex = '#' + (b.color ?? 0x4f9dff).toString(16).padStart(6, '0');
            return `<div class="item${visible ? '' : ' hidden-branch'}" data-branch="${b.id}">` +
                `<input type="checkbox" ${visible ? 'checked' : ''} />` +
                `<span class="swatch" style="background:${colorHex}"></span>` +
                `<span class="name" title="${esc(b.name)}">${esc(b.name)}</span>` +
                `<span class="count">${b.commits}</span></div>`;
        }).join('') + (hasMore ? `<div class="item load-more" style="justify-content:center;color:var(--muted);cursor:pointer;">Show more (${filtered.length - (page + 1) * PAGE_SIZE} more)</div>` : '');
        // event delegation: single listener on the container
        legendList.querySelectorAll('.item[data-branch]').forEach((el) => {
            const bid = parseInt(el.dataset.branch, 10);
            el.addEventListener('click', (e) => {
                if (e.target.tagName === 'INPUT') return;
                const cb = el.querySelector('input');
                cb.checked = !cb.checked;
                toggleBranch(bid, cb.checked);
            });
            el.querySelector('input').addEventListener('change', (e) => {
                e.stopPropagation();
                toggleBranch(bid, e.target.checked);
            });
        });
        const loadMore = legendList.querySelector('.load-more');
        if (loadMore) loadMore.addEventListener('click', () => { legendPage++; renderLegendList(graph, filter); });
    }

    function toggleBranch(branchId, visible) {
        branchVisibility.set(branchId, visible);
        const el = legendList.querySelector(`.item[data-branch="${branchId}"]`);
        if (el) el.classList.toggle('hidden-branch', !visible);
        updateBranchFilter();
    }

    function updateBranchFilter() {
        if (!current || !current.setBranchFilter) return;
        const visible = new Set();
        for (const [bid, v] of branchVisibility) if (v) visible.add(bid);
        // if all visible, pass null (no filter)
        const allVisible = visible.size === branchVisibility.size;
        current.setBranchFilter(allVisible ? null : visible);
    }

    legendSearch.addEventListener('input', () => {
        if (searchDebounce) clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
            legendPage = 0;
            if (currentGraph) renderLegendList(currentGraph, legendSearch.value);
        }, 150);
    });
    document.getElementById('gengit3d-legend-all').addEventListener('click', () => {
        for (const [bid] of branchVisibility) branchVisibility.set(bid, true);
        legendPage = 0;
        if (currentGraph) renderLegendList(currentGraph, legendSearch.value);
        updateBranchFilter();
    });
    document.getElementById('gengit3d-legend-none').addEventListener('click', () => {
        for (const [bid] of branchVisibility) branchVisibility.set(bid, false);
        legendPage = 0;
        if (currentGraph) renderLegendList(currentGraph, legendSearch.value);
        updateBranchFilter();
    });
    document.getElementById('gengit3d-legend-top').addEventListener('click', () => {
        const branches = currentGraph ? [...currentGraph.branches].sort((a, b) => b.commits - a.commits) : [];
        const top10 = new Set(branches.slice(0, 10).map((b) => b.id));
        for (const [bid] of branchVisibility) branchVisibility.set(bid, top10.has(bid));
        legendPage = 0;
        if (currentGraph) renderLegendList(currentGraph, legendSearch.value);
        updateBranchFilter();
    });

    // ── date filter ──────────────────────────────────────────────────────────
    const dateFrom = document.getElementById('gengit3d-date-from');
    const dateTo = document.getElementById('gengit3d-date-to');
    const dateApply = document.getElementById('gengit3d-date-apply');
    const dateClear = document.getElementById('gengit3d-date-clear');

    function applyDateFilter() {
        if (!current || !current.setDateFilter) return;
        const from = dateFrom.value ? new Date(dateFrom.value + 'T00:00:00').getTime() : null;
        const to = dateTo.value ? new Date(dateTo.value + 'T23:59:59').getTime() : null;
        current.setDateFilter(from, to);
    }
    function clearDateFilter() {
        dateFrom.value = '';
        dateTo.value = '';
        if (current && current.setDateFilter) current.setDateFilter(null, null);
    }
    document.getElementById('gengit3d-date-apply').addEventListener('click', applyDateFilter);
    dateClear.addEventListener('click', clearDateFilter);
    dateFrom.addEventListener('change', applyDateFilter);
    dateTo.addEventListener('change', applyDateFilter);

    // ── commit details ───────────────────────────────────────────────────────
    function colorizePatch(text) {
      return esc(text).split('\n').map((line) => {
        if (line.startsWith('+')) return '<span class="add">' + line + '</span>';
        if (line.startsWith('-')) return '<span class="del">' + line + '</span>';
        if (line.startsWith('@@')) return '<span class="hunk">' + line + '</span>';
        return line;
      }).join('\n');
    }

    function openDetail() { detail.classList.add('open'); }
    document.getElementById('gengit3d-detail-close').addEventListener('click', () => detail.classList.remove('open'));

    async function showCommitDetails(node, ctx) {
      openDetail();
      const repo = (ctx && ctx.repo) || (currentSource && currentSource.repo);
      detailBody.innerHTML = '<div class="empty">loading ' + esc(node.short) + ' …</div>';
      if (!repo) { detailBody.innerHTML = '<div class="empty">no repo source — re-render from a path/URL.</div>'; return; }
      try {
        const qs = 'repo=' + encodeURIComponent(repo) + '&hash=' + encodeURIComponent(node.id) + '&maxPatch=60000';
        const res = await fetch('/api/commit?' + qs, { cache: 'no-store' });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || ('HTTP ' + res.status));
        const files = (d.files || []).map((f) => `<li><span class="a">+${f.added ?? '–'}</span><span class="d">-${f.deleted ?? '–'}</span><span class="p">${esc(f.path)}</span></li>`).join('');
        detailBody.innerHTML =
          `<h2>${esc(d.short)} — ${esc(d.subject)}</h2>` +
          `<div class="meta"><b>author</b> ${esc(d.author)} &lt;${esc(d.email)}&gt;<br>` +
          `<b>date</b> ${esc(d.date)}<br>` +
          (d.committer && d.committer !== d.author ? `<b>committer</b> ${esc(d.committer)}<br>` : '') +
          `<b>parents</b> ${d.parents.length ? d.parents.map((p) => esc(p.slice(0, 10))).join(', ') : '(root)'}</div>` +
          (d.body ? `<div class="msg">${esc(d.body)}</div>` : '') +
          `<div class="stat">${d.stats.files} file(s) · <span style="color:var(--diff-add)">+${d.stats.added}</span> / <span style="color:var(--diff-del)">-${d.stats.deleted}</span></div>` +
          `<ul class="files">${files || '<li class="p">(no files — merge commit?)</li>'}</ul>` +
          (d.patch ? `<pre class="diff">${colorizePatch(d.patch)}</pre>` + (d.patchTruncated ? '<div class="empty">… patch truncated</div>' : '') : '');
      } catch (e) {
        detailBody.innerHTML = '<div class="empty err">error: ' + esc(e.message) + '</div>';
      }
    }

    // ── data ────────────────────────────────────────────────────────────────
    async function fetchGraph(endpoint, qs, label) {
      setStatus('loading…', 'busy');
      renderBtn.disabled = true;
      try {
        const res = await fetch(endpoint + '?' + qs, { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        draw(data, label(data), data.source);
      } catch (e) {
        setStatus('error: ' + e.message, 'err');
        loading.innerHTML = '<span class="err">' + esc(e.message) + '</span>';
        loading.style.display = 'flex';
      } finally {
        renderBtn.disabled = false;
      }
    }

    async function renderFromInput() {
      const v = input.value.trim();
      if (!v) { setStatus('enter a repo path or git URL', 'err'); return; }
      if (isUrl(v)) {
        const depth = parseInt(depthEl.value, 10) || 0;
        await fetchGraph('/api/clone', 'url=' + encodeURIComponent(v) + '&depth=' + depth,
          (d) => `cloned ${d.source.url} → ${d.nodes.length} commits, ${d.branches.length} branches`);
      } else {
        await fetchGraph('/api/graph', 'repo=' + encodeURIComponent(v),
          (d) => `${d.source.repo} → ${d.nodes.length} commits, ${d.branches.length} branches`);
      }
    }

    renderBtn.addEventListener('click', renderFromInput);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') renderFromInput(); });
    rotateEl.addEventListener('change', () => { if (current) current.setAutoRotate(rotateEl.checked); });

    // theme <select>
    themeSel.innerHTML = Object.entries(THEMES)
      .map(([k, t]) => `<option value="${k}">${esc(t.label)}</option>`).join('');
    themeSel.value = theme;
    themeSel.addEventListener('change', () => setTheme(themeSel.value));
    applyChrome(theme);

    // Populate the datalist with git repos discoverable server-side.
    (async function loadRepos() {
      try {
        const res = await fetch('/api/repos', { cache: 'no-store' });
        const { repos } = await res.json();
        const dl = document.getElementById('gengit3d-repos');
        dl.innerHTML = (repos || []).map((r) => `<option value="${esc(r)}"></option>`).join('');
        if (repos && repos.length) input.setAttribute('placeholder', `repo path or git URL — e.g. ${repos[0]}`);
      } catch { /* discovery is best-effort */ }
    })();

    // Boot: load the server-side graph (generated by the entrypoint), else prompt.
    (async function boot() {
      try {
        const res = await fetch('./gengit3d.graph.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const graph = await res.json();
        draw(graph, `default graph: ${graph.nodes.length} commits, ${graph.branches.length} branches`);
      } catch (e) {
        loading.innerHTML = '<span class="err">no gengit3d.graph.json yet.<br>' +
          'Enter a repo path or git URL above and press Render.<br>' + esc(e.message) + '</span>';
        stats.textContent = 'no graph';
        setStatus('ready — enter a repo path or git URL', '');
      }
    })();
  </script>
</body>
</html>
